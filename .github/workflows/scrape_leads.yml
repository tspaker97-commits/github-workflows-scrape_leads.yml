name: Weekly Courthouse Lead Ingestion

on:
  schedule:
    - cron: '0 6 * * 1'  # Runs every Monday at 6:00 AM UTC
  workflow_dispatch:      # Allows manual one-click trigger anytime

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Execute Lead Pipeline
        run: |
          python run_lead_pipeline.py

      - name: Commit and Push Fresh Leads
        run: |
          git config --global user.name "LeadBot"
          git config --global user.email "leadbot@automation.local"
          git add output_leads/
          git commit -m "Automated Lead Ingestion: $(date +'%Y-%m-%d')" || exit 0
          git push
